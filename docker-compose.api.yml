services:
  attack-flow-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ENABLED: ${CORS_ENABLED:-false}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      CORS_ALLOW_METHODS: ${CORS_ALLOW_METHODS:-*}
      CORS_ALLOW_HEADERS: ${CORS_ALLOW_HEADERS:-*}
      DATA_DIR: ${DATA_DIR:-/var/lib/attack-flow/data}
      SQLITE_PATH: ${SQLITE_PATH:-/var/lib/attack-flow/data/attack-flow.db}
      UPLOAD_DIR: ${UPLOAD_DIR:-/var/lib/attack-flow/data/uploads}
      ARTIFACT_DIR: ${ARTIFACT_DIR:-/var/lib/attack-flow/data/artifacts}
      PROVIDERS_CONFIG_PATH: ${PROVIDERS_CONFIG_PATH:-/app/config/providers.yml}
      ALLOW_RUNTIME_PROVIDER_OVERRIDE: ${ALLOW_RUNTIME_PROVIDER_OVERRIDE:-false}
      ALLOW_RUNTIME_PROVIDER_TYPES: ${ALLOW_RUNTIME_PROVIDER_TYPES:-openai,openai_compatible,azure_openai}
      ALLOW_RUNTIME_PROVIDER_EXTRA_HEADERS: ${ALLOW_RUNTIME_PROVIDER_EXTRA_HEADERS:-false}
      RUNTIME_PROVIDER_TIMEOUT_SECONDS: ${RUNTIME_PROVIDER_TIMEOUT_SECONDS:-180}
      LITELLM_LOCAL_MODEL_COST_MAP: ${LITELLM_LOCAL_MODEL_COST_MAP:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COMPATIBLE_PROVIDER_API_KEY: ${COMPATIBLE_PROVIDER_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FILE_STORAGE_STRICT_MODE: ${FILE_STORAGE_STRICT_MODE:-true}
      FILE_STORAGE_MAX_BYTES: ${FILE_STORAGE_MAX_BYTES:-10485760}
    volumes:
      - attack_flow_api_data:/var/lib/attack-flow/data
    ports:
      - "${API_BIND_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  attack_flow_api_data:
